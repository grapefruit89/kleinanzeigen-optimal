<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kleinanzeigen Tools</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h2>Kleinanzeigen Tools</h2>
    </div>
    <div class="module-list">
        <div class="module-item"><div class="module-info"><h3>Rental Analyzer</h3></div><label class="switch"><input type="checkbox" id="feature_RentalAnalyzer"><span class="slider round"></span></label></div>
        <div class="module-item"><div class="module-info"><h3>WASD Navigation</h3></div><label class="switch"><input type="checkbox" id="feature_WasdNavigation"><span class="slider round"></span></label></div>
        <div class="module-item"><div class="module-info"><h3>UI Cleaner</h3></div><label class="switch"><input type="checkbox" id="feature_UiCleaner"><span class="slider round"></span></label></div>
        <div class="module-item"><div class="module-info"><h3>High-Res Zoom</h3></div><label class="switch"><input type="checkbox" id="feature_HighResZoom"><span class="slider round"></span></label></div>
        <div class="module-item"><div class="module-info"><h3>Sortierung speichern</h3></div><label class="switch"><input type="checkbox" id="feature_SortSaver"><span class="slider round"></span></label></div>
        <div class="module-item"><div class="module-info"><h3>Widescreen Layout</h3></div><label class="switch"><input type="checkbox" id="feature_WidescreenLayout"><span class="slider round"></span></label></div>
        <div class="module-item"><div class="module-info"><h3>Auto Mehr anzeigen</h3></div><label class="switch"><input type="checkbox" id="feature_AutoShowMore"><span class="slider round"></span></label></div>
        <!-- TrackerBlocker + ProAdManager: FELSENFEST (2026-09-09), kein Toggle -->
        <div class="module-item"><div class="module-info"><h3>Startseite aufraeumen</h3></div><label class="switch"><input type="checkbox" id="feature_CleanHomepage"><span class="slider round"></span></label></div>
        <div class="module-item"><div class="module-info"><h3>Datenexport (TO LLM)</h3></div><label class="switch"><input type="checkbox" id="feature_DataExport"><span class="slider round"></span></label></div>
        <div class="module-item"><div class="module-info"><h3>Such-Aufnahme (REC)</h3></div><label class="switch"><input type="checkbox" id="feature_AdRecorder"><span class="slider round"></span></label></div>
    </div>
    <script src="../core/Storage.js"></script>
    <script src="popup.js"></script>
</body>
</html>
