<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>KA Analyzer</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 12px; background: #17181c; color: #e8e8ea; font: 13px/1.45 system-ui, sans-serif; }
        h1 { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; gap: 6px; }
        .sub { color: #8a8b92; font-size: 11px; margin-bottom: 12px; }
        section { background: #1e1f25; border: 1px solid #2b2d34; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
        h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #9aa0aa; margin: 0 0 8px; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 0; }
        .row .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .muted { color: #8a8b92; font-size: 11px; }
        button { background: #2f3138; color: #e8e8ea; border: 1px solid #3d3f47; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
        button:hover { background: #3a3d45; }
        button.primary { background: #2952a3; border-color: #3565bf; }
        button.danger { background: #7a2530; border-color: #96303e; }
        button:disabled { opacity: .45; cursor: default; }
        .switch { position: relative; width: 34px; height: 18px; flex: none; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; background: #3a3d45; border-radius: 10px; transition: .15s; cursor: pointer; }
        .slider:before { content: ""; position: absolute; height: 14px; width: 14px; left: 2px; top: 2px; background: #cfd1d6; border-radius: 50%; transition: .15s; }
        .switch input:checked + .slider { background: #2f6f3f; }
        .switch input:checked + .slider:before { transform: translateX(16px); }
        .locked .slider { background: #2f3138; cursor: not-allowed; }
        .locked .slider:before { background: #6a6d75; }
        .locked input { pointer-events: none; }
        .stat { font-variant-numeric: tabular-nums; font-weight: 600; }
        .empty { color: #8a8b92; font-style: italic; }
        .db-list { max-height: 180px; overflow-y: auto; font-size: 11px; }
        .db-item { padding: 3px 4px; border-bottom: 1px solid #26282e; display: flex; justify-content: space-between; gap: 6px; }
        .badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #2f3138; color: #9aa0aa; flex: none; }
        .ok { color: #6fc98a; } .warn { color: #e0b45c; }
        #toast { position: fixed; bottom: 10px; left: 12px; right: 12px; background: #2952a3; color: #fff; padding: 7px 10px; border-radius: 6px; font-size: 12px; display: none; z-index: 9; }
    </style>
</head>
<body>
    <h1>🏠 KA Analyzer</h1>
    <div class="sub">Zentrale — SidePanel rechts · Version <span id="ext-version">…</span></div>

    <section>
        <h2>⏺ Such-Aufnahme (AdRecorder)</h2>
        <div class="row"><span class="label" id="rec-status">Lädt…</span><span class="badge stat" id="rec-count">0</span></div>
        <div class="row" style="gap:6px;">
            <button id="btn-rec-download" class="primary" disabled>Download JSON</button>
            <button id="btn-rec-clear" class="danger" disabled>Aufnahme leeren</button>
        </div>
        <div class="muted" id="rec-meta"></div>
    </section>

    <section>
        <h2>📊 Rental-DB (EUR/m²-Datenbasis)</h2>
        <div class="row"><span class="label">Einträge</span><span class="badge stat" id="db-count">0</span></div>
        <div class="row"><span class="label">Mediane erfasst</span><span class="badge stat" id="db-cats">0</span></div>
        <div class="db-list" id="db-list"><div class="empty">Keine Einträge — aktiviere Rental Analyzer und besuche Suchseiten.</div></div>
        <div class="row" style="margin-top:6px;"><button id="btn-db-clear" class="danger">rental_db leeren</button></div>
    </section>

    <section>
        <h2>🧹 Cache &amp; Hygiene</h2>
        <div class="row"><span class="label">ka_enrich_cache</span><span class="badge stat" id="cache-count">0</span></div>
        <div class="row"><button id="btn-cache-clear" class="danger">Cache leeren</button><span class="muted">TTL 7d (SW-Alarm)</span></div>
    </section>

    <section>
        <h2>🧩 Features</h2>
        <div id="feature-list">Lädt…</div>
    </section>

    <div id="toast"></div>
    <script src="panel.js"></script>
</body>
</html>
